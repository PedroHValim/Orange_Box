<text x="56" y="850" font-size="15" font-weight="bold" fill="#6639ba">Ligações entre os fluxos</text>
<rect x="56" y="861" width="34" height="20" rx="10" fill="#6639ba"/><text x="73" y="876" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">L1</text>
<text x="100" y="876" font-size="14" font-weight="bold" fill="#24292f">O05 → O06</text><text x="200" y="876" font-size="14" fill="#24292f">os achados enviados pelo trabalhador formam o resumo e a cobertura do ciclo.</text>
<rect x="56" y="887" width="34" height="20" rx="10" fill="#6639ba"/><text x="73" y="902" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">L2</text>
<text x="100" y="902" font-size="14" font-weight="bold" fill="#24292f">O05 → O13</text><text x="200" y="902" font-size="14" fill="#24292f">os achados enviados aparecem ao agrônomo como detecções novas.</text>
<rect x="56" y="913" width="34" height="20" rx="10" fill="#6639ba"/><text x="73" y="928" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">L3</text>
<text x="100" y="928" font-size="14" font-weight="bold" fill="#24292f">O08 → O13</text><text x="200" y="928" font-size="14" fill="#24292f">a posição “parecer do agrônomo” gera o pedido de parecer.</text>
<rect x="56" y="939" width="34" height="20" rx="10" fill="#6639ba"/><text x="73" y="954" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">L4</text>
<text x="100" y="954" font-size="14" font-weight="bold" fill="#24292f">O08 → O01</text><text x="200" y="954" font-size="14" fill="#24292f">a posição “reinspeção” entra na rota do trabalhador.</text>
<rect x="56" y="965" width="34" height="20" rx="10" fill="#6639ba"/><text x="73" y="980" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">L5</text>
<text x="100" y="980" font-size="14" font-weight="bold" fill="#24292f">O16 → O01</text><text x="200" y="980" font-size="14" fill="#24292f">o pedido de nova foto entra na rota do trabalhador, ligado ao ponto.</text>
<rect x="56" y="991" width="34" height="20" rx="10" fill="#6639ba"/><text x="73" y="1006" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">L6</text>
<text x="100" y="1006" font-size="14" font-weight="bold" fill="#24292f">O18 → O10</text><text x="200" y="1006" font-size="14" fill="#24292f">o parecer recebido apoia a decisão do ciclo; quem decide é o gestor.</text>
<rect x="56" y="1017" width="34" height="20" rx="10" fill="#6639ba"/><text x="73" y="1032" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">L7</text>
<text x="100" y="1032" font-size="14" font-weight="bold" fill="#24292f">O15 ↔ O09</text><text x="200" y="1032" font-size="14" fill="#24292f">histórico de detecções e evolução do talhão usam os mesmos registros.</text>
