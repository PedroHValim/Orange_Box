<path class="edge" d="M1925,682 L1940,682"/>
<path class="edge" d="M1925,812 L1940,812"/>
<path class="edge" d="M1260,480 L1260,930 L330,930 L330,980"/>
<path class="edge" d="M1260,930 L950,930 L950,980"/>
