<rect x="700" y="112" width="1120" height="123" rx="9" fill="#163e5b" stroke="#163e5b" stroke-width="2.4"/>
<text x="1260.0" y="144" text-anchor="middle" font-size="21" font-weight="700" style="fill:#ffffff">0</text>
<text x="1260.0" y="176" text-anchor="middle" font-size="24" font-weight="700" style="fill:#ffffff">Inspecionar a rota do dia e repassar os achados</text>
<text x="1260.0" y="210" text-anchor="middle" font-size="21" style="fill:#ffffff">Plano 0: 1 → 2 (repetir por árvore e fruto) → 3.</text>
<rect x="80" y="310" width="500" height="130" rx="9" fill="#eaf3f8" stroke="#163e5b" stroke-width="2.4"/>
<text x="330.0" y="342" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">1</text>
<text x="330.0" y="374" text-anchor="middle" font-size="24" font-weight="700" style="fill:#172b3a">Preparar a inspeção</text>
<text x="330.0" y="408" text-anchor="middle" font-size="21" style="fill:#172b3a">Plano 1: 1.1 → 1.2.</text>
<rect x="700" y="310" width="1120" height="170" rx="9" fill="#eaf3f8" stroke="#163e5b" stroke-width="2.4"/>
<text x="1260.0" y="342" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">2</text>
<text x="1260.0" y="374" text-anchor="middle" font-size="24" font-weight="700" style="fill:#172b3a">Inspecionar árvore e frutos</text>
<text x="1260.0" y="408" text-anchor="middle" font-size="21" style="fill:#172b3a">Plano 2: 2.1 → 2.2 → 2.3 → 2.4.</text>
<text x="1260.0" y="434" text-anchor="middle" font-size="21" style="fill:#172b3a">Repetir 2.2–2.4 para cada fruto selecionado;</text>
<text x="1260.0" y="460" text-anchor="middle" font-size="21" style="fill:#172b3a">repetir 2 para cada árvore da área combinada.</text>
<rect x="1940" y="310" width="500" height="155" rx="9" fill="#eaf3f8" stroke="#163e5b" stroke-width="2.4"/>
<text x="2190.0" y="342" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">3</text>
<text x="2190.0" y="374" text-anchor="middle" font-size="24" font-weight="700" style="fill:#172b3a">Encerrar percurso e verificar repasse</text>
<text x="2190.0" y="408" text-anchor="middle" font-size="21" style="fill:#172b3a">Plano 3: 3.1 → 3.2 → 3.3,</text>
<text x="2190.0" y="434" text-anchor="middle" font-size="21" style="fill:#172b3a">conforme canal e conexão.</text>
<rect x="80" y="480" width="500" height="105" rx="9" fill="#ffffff" stroke="#8498a6" stroke-width="2.4"/>
<text x="330.0" y="512" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">1.1</text>
<text x="330.0" y="544" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">Compreender a área combinada</text>
<line x1="282.0" y1="592" x2="378.0" y2="592" stroke="#163e5b" stroke-width="4"/>
<rect x="80" y="610" width="500" height="105" rx="9" fill="#ffffff" stroke="#8498a6" stroke-width="2.4"/>
<text x="330.0" y="642" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">1.2</text>
<text x="330.0" y="674" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">Deixar o celular pronto para</text>
<text x="330.0" y="703" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">fotografar</text>
<line x1="282.0" y1="722" x2="378.0" y2="722" stroke="#163e5b" stroke-width="4"/>
<rect x="1940" y="500" width="500" height="105" rx="9" fill="#ffffff" stroke="#8498a6" stroke-width="2.4"/>
<text x="2190.0" y="532" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">3.1</text>
<text x="2190.0" y="564" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">Conferir se cobriu as áreas</text>
<text x="2190.0" y="593" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">combinadas</text>
<line x1="2142.0" y1="612" x2="2238.0" y2="612" stroke="#163e5b" stroke-width="4"/>
<rect x="1940" y="630" width="500" height="105" rx="9" fill="#ffffff" stroke="#8498a6" stroke-width="2.4"/>
<text x="2190.0" y="662" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">3.2</text>
<text x="2190.0" y="694" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">Enviar os registros quando houver</text>
<text x="2190.0" y="723" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">conexão</text>
<line x1="2142.0" y1="742" x2="2238.0" y2="742" stroke="#163e5b" stroke-width="4"/>
<rect x="1940" y="760" width="500" height="105" rx="9" fill="#ffffff" stroke="#8498a6" stroke-width="2.4"/>
<text x="2190.0" y="792" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">3.3</text>
<text x="2190.0" y="824" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">Confirmar que o envio ocorreu</text>
<line x1="2142.0" y1="872" x2="2238.0" y2="872" stroke="#163e5b" stroke-width="4"/>
<rect x="80" y="980" width="500" height="145" rx="9" fill="#ffffff" stroke="#8498a6" stroke-width="2.4"/>
<text x="330.0" y="1012" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">2.1</text>
<text x="330.0" y="1044" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">Escolher os frutos da árvore</text>
<text x="330.0" y="1078" text-anchor="middle" font-size="20" style="fill:#172b3a">Amostragem proposta: 3–5 frutos;</text>
<text x="330.0" y="1103" text-anchor="middle" font-size="20" style="fill:#172b3a">ramos internos se necessário.</text>
<line x1="282.0" y1="1132" x2="378.0" y2="1132" stroke="#163e5b" stroke-width="4"/>
<rect x="700" y="980" width="500" height="145" rx="9" fill="#eaf3f8" stroke="#163e5b" stroke-width="2.4"/>
<text x="950.0" y="1012" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">2.2</text>
<text x="950.0" y="1044" text-anchor="middle" font-size="24" font-weight="700" style="fill:#172b3a">Obter imagem utilizável</text>
<text x="950.0" y="1078" text-anchor="middle" font-size="21" style="fill:#172b3a">Plano 2.2: 2.2.1 → 2.2.2 → 2.2.3.</text>
<text x="950.0" y="1104" text-anchor="middle" font-size="21" style="fill:#172b3a">Se inadequada, repetir 2.2.1–2.2.2.</text>
<rect x="1320" y="980" width="500" height="145" rx="9" fill="#eaf3f8" stroke="#163e5b" stroke-width="2.4"/>
<text x="1570.0" y="1012" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">2.3</text>
<text x="1570.0" y="1044" text-anchor="middle" font-size="24" font-weight="700" style="fill:#172b3a">Interpretar a indicação</text>
<text x="1570.0" y="1078" text-anchor="middle" font-size="21" style="fill:#172b3a">Plano 2.3:</text>
<text x="1570.0" y="1104" text-anchor="middle" font-size="21" style="fill:#172b3a">2.3.1 → 2.3.2 → 2.3.3.</text>
<rect x="1940" y="980" width="500" height="145" rx="9" fill="#eaf3f8" stroke="#163e5b" stroke-width="2.4"/>
<text x="2190.0" y="1012" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">2.4</text>
<text x="2190.0" y="1044" text-anchor="middle" font-size="24" font-weight="700" style="fill:#172b3a">Resolver o resultado do fruto</text>
<text x="2190.0" y="1078" text-anchor="middle" font-size="21" style="fill:#172b3a">Plano 2.4: escolher conforme o caso:</text>
<text x="2190.0" y="1104" text-anchor="middle" font-size="21" style="fill:#172b3a">2.4.1, 2.4.2 ou 2.4.3.</text>
<rect x="700" y="1175" width="500" height="110" rx="9" fill="#ffffff" stroke="#8498a6" stroke-width="2.4"/>
<text x="950.0" y="1207" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">2.2.1</text>
<text x="950.0" y="1239" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">Posicionar o celular sobre o fruto</text>
<line x1="902.0" y1="1292" x2="998.0" y2="1292" stroke="#163e5b" stroke-width="4"/>
<rect x="700" y="1330" width="500" height="110" rx="9" fill="#ffffff" stroke="#8498a6" stroke-width="2.4"/>
<text x="950.0" y="1362" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">2.2.2</text>
<text x="950.0" y="1394" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">Conferir enquadramento e foco</text>
<line x1="902.0" y1="1447" x2="998.0" y2="1447" stroke="#163e5b" stroke-width="4"/>
<rect x="700" y="1485" width="500" height="110" rx="9" fill="#ffffff" stroke="#8498a6" stroke-width="2.4"/>
<text x="950.0" y="1517" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">2.2.3</text>
<text x="950.0" y="1549" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">Acionar a captura</text>
<line x1="902.0" y1="1602" x2="998.0" y2="1602" stroke="#163e5b" stroke-width="4"/>
<rect x="1320" y="1175" width="500" height="110" rx="9" fill="#ffffff" stroke="#8498a6" stroke-width="2.4"/>
<text x="1570.0" y="1207" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">2.3.1</text>
<text x="1570.0" y="1239" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">Aguardar o resultado</text>
<line x1="1522.0" y1="1292" x2="1618.0" y2="1292" stroke="#163e5b" stroke-width="4"/>
<rect x="1320" y="1330" width="500" height="110" rx="9" fill="#ffffff" stroke="#8498a6" stroke-width="2.4"/>
<text x="1570.0" y="1362" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">2.3.2</text>
<text x="1570.0" y="1394" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">Ler a indicação de sinal ou não sinal</text>
<line x1="1522.0" y1="1447" x2="1618.0" y2="1447" stroke="#163e5b" stroke-width="4"/>
<rect x="1320" y="1485" width="500" height="110" rx="9" fill="#ffffff" stroke="#8498a6" stroke-width="2.4"/>
<text x="1570.0" y="1517" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">2.3.3</text>
<text x="1570.0" y="1549" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">Avaliar se confia no resultado</text>
<line x1="1522.0" y1="1602" x2="1618.0" y2="1602" stroke="#163e5b" stroke-width="4"/>
<rect x="1940" y="1175" width="500" height="110" rx="9" fill="#ffffff" stroke="#8498a6" stroke-width="2.4"/>
<text x="2190.0" y="1207" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">2.4.1</text>
<text x="2190.0" y="1239" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">Seguir ao próximo fruto ou árvore</text>
<line x1="2142.0" y1="1292" x2="2238.0" y2="1292" stroke="#163e5b" stroke-width="4"/>
<rect x="1940" y="1330" width="500" height="110" rx="9" fill="#ffffff" stroke="#8498a6" stroke-width="2.4"/>
<text x="2190.0" y="1362" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">2.4.2</text>
<text x="2190.0" y="1394" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">Reconfirmar: refazer a captura ou</text>
<text x="2190.0" y="1423" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">pedir a um colega</text>
<line x1="2142.0" y1="1447" x2="2238.0" y2="1447" stroke="#163e5b" stroke-width="4"/>
<rect x="1940" y="1485" width="500" height="110" rx="9" fill="#ffffff" stroke="#8498a6" stroke-width="2.4"/>
<text x="2190.0" y="1517" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b3a">2.4.3</text>
<text x="2190.0" y="1549" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">Avisar o dono e garantir o registro</text>
<text x="2190.0" y="1578" text-anchor="middle" font-size="24" font-weight="700" text-decoration="underline" style="fill:#172b3a">do local</text>
<line x1="2142.0" y1="1602" x2="2238.0" y2="1602" stroke="#163e5b" stroke-width="4"/>
<rect x="80" y="1210" width="500" height="385" rx="10" fill="#f6f8fa" stroke="#c7d3db"/>
<text x="330" y="1254" text-anchor="middle" font-size="24" font-weight="700">Condições do plano 2.4</text>
<text x="330" y="1305" text-anchor="middle" font-size="21">2.4.1: quando puder prosseguir.</text>
<text x="330" y="1346" text-anchor="middle" font-size="21">2.4.2: quando houver dúvida;</text>
<text x="330" y="1387" text-anchor="middle" font-size="21">se persistir, buscar apoio disponível.</text>
<text x="330" y="1428" text-anchor="middle" font-size="21">2.4.3: se houver achado a comunicar.</text>
<text x="330" y="1469" text-anchor="middle" font-size="21">Canal e destinatário são hipóteses.</text>
<rect x="80" y="1660" width="2360" height="225" rx="12" fill="#f4f7fa" stroke="#c7d3db"/>
<text x="1260" y="1700" text-anchor="middle" font-size="25" font-weight="700">Leitura e limites do modelo</text>
<text x="1260" y="1740" text-anchor="middle" font-size="21">Linhas mostram decomposição, não sequência. Planos definem ordem, repetição e condições; operações-folha têm texto sublinhado e marca inferior.</text>
<text x="1260" y="1780" text-anchor="middle" font-size="21">3.2 depende de canal/conexão; em 3.3, verificar a evidência disponível e manter o repasse como pendente se não houver confirmação.</text>
<text x="1260" y="1820" text-anchor="middle" font-size="21">Indicação automática não é diagnóstico; salvo localmente não significa enviado, recebido ou lido. GPS do celular não garante a árvore exata.</text>
<text x="1260" y="1860" text-anchor="middle" font-size="21">Modelo proposto com hipóteses H04, H08 e H09 ainda a validar com inspetores reais. Não comprova funções implementadas ou validação de campo.</text>
</svg>