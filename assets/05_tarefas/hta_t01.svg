<svg xmlns="http://www.w3.org/2000/svg" width="2520" height="1940" viewBox="0 0 2520 1940" role="img" aria-labelledby="title desc">
<title id="title">HTA T01 — Inspecionar a rota do dia e repassar os achados</title>
<desc id="desc">Decomposição hierárquica com operações-folha sublinhadas, planos de sequência, repetição e condições. Modelo proposto com hipóteses ainda não validadas com inspetores de campo.</desc>
<rect width="2520" height="1940" fill="#ffffff"/>
<style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#172b3a} .edge{fill:none;stroke:#697c89;stroke-width:2.5} .heading{font-weight:700} .leaf{text-decoration:underline} </style>
<text x="1260" y="48" text-anchor="middle" font-size="36" font-weight="700">HTA — T01 | Inspecionar a rota do dia e repassar os achados</text>
<text x="1260" y="84" text-anchor="middle" font-size="21">Lucas Tonoli Cabral Duarte · 24.123.032-5 · P02 / C02</text>
<path class="edge" d="M1260,235 L1260,270 L330,270 L330,310"/>
<path class="edge" d="M1260,235 L1260,310"/>
<path class="edge" d="M1260,270 L2190,270 L2190,310"/>
